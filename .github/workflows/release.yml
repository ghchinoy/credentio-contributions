name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: 'Publish wheels to PyPI (defaults to false for manual/dry-run dispatches)'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark release as pre-release on GitHub'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # Required for PyPI Trusted Publishing

jobs:
  build-swift:
    name: Build Swift XCFramework (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || true
          swift --version

      - name: Build and Package CredentioC.xcframework
        env:
          CREDENTIO_ZIP_RELEASE: "1"
        run: |
          ./scripts/build-swift-xcframework.sh --zip

      - name: Upload Swift Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swift-xcframework
          path: |
            swift/CredentioC.xcframework.zip
            swift/CredentioC.xcframework.zip.sha256

  build-native-and-wheels:
    name: Build Native Libs & Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform_tag: darwin-arm64
            lib_name: libcredentio_c.dylib
            ext: dylib
            cibw_archs: arm64
          - os: ubuntu-latest
            platform_tag: linux-amd64
            lib_name: libcredentio_c.so
            ext: so
            cibw_archs: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel (macOS)
        if: runner.os == 'macOS'
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Native Shared Library (macOS host)
        if: runner.os == 'macOS'
        run: |
          ./scripts/build-shared-lib.sh

      - name: Stage named platform binary for Go release assets (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-libs
          if [ -f "go/lib/${{ matrix.lib_name }}" ]; then
            cp "go/lib/${{ matrix.lib_name }}" "release-libs/libcredentio_c-${{ matrix.platform_tag }}.${{ matrix.ext }}"
          fi

      - name: Build wheels via cibuildwheel
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: python
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            (manylinux-install-clang || true) &&
            (dnf install -y git 2>/dev/null || yum install -y git 2>/dev/null || true) &&
            echo "#include <array>" | clang++ -x c++ -fsyntax-only - &&
            curl -sLo /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 &&
            chmod +x /usr/local/bin/bazel &&
            export CREDENTIO_BAZEL_STARTUP_FLAGS="--noworkspace_rc" &&
            export CREDENTIO_EXTRA_BAZEL_FLAGS="--repo_env=CC=clang --repo_env=CXX=clang++ --cxxopt=-std=c++20" &&
            ./scripts/build-shared-lib.sh
          CIBW_BEFORE_ALL_MACOS: ./scripts/build-shared-lib.sh
          CIBW_ENVIRONMENT: "CREDENTIO_GIT_URL=https://mediaprovenance.googlesource.com/credentio CREDENTIO_SHA=4ac69fc58256d3871e765f615254373e19e250e9"

      - name: Stage named platform binary for Go release assets (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-libs
          if [ -f "go/lib/libcredentio_c.so" ]; then
            cp "go/lib/libcredentio_c.so" "release-libs/libcredentio_c-linux-amd64.so"
          fi
          if [ ! -f "release-libs/libcredentio_c-linux-amd64.so" ] && ls wheelhouse/*.whl 1>/dev/null 2>&1; then
            python -m zipfile -e $(ls wheelhouse/*.whl | head -1) /tmp/whl-extract
            find /tmp/whl-extract -name "libcredentio_c*.so*" -exec cp {} release-libs/libcredentio_c-linux-amd64.so \;
          fi

      - name: Upload Native Libs
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.platform_tag }}
          path: release-libs/*

      - name: Upload Python Wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.platform_tag }}
          path: wheelhouse/*.whl

  publish-release:
    name: Create GitHub Release & Publish
    needs: [build-swift, build-native-and-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather assets for release
        run: |
          mkdir -p dist-release
          find artifacts/ -type f -exec cp {} dist-release/ \;
          echo "=== Release Assets Gathered ==="
          ls -lh dist-release/

      - name: Determine Pre-release Status
        id: prerelease_check
        run: |
          IS_PRERELEASE="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IS_PRERELEASE="${{ github.event.inputs.is_prerelease }}"
          elif [[ "${{ github.ref_name }}" == *"-rc"* || "${{ github.ref_name }}" == *"-beta"* || "${{ github.ref_name }}" == *"-alpha"* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease == 'true' }}

      - name: Publish to PyPI
        if: ${{ (github.event_name == 'push' && steps.prerelease_check.outputs.is_prerelease == 'false') || github.event.inputs.publish_pypi == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-release/
          skip-existing: true
