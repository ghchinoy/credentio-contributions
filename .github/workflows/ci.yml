name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies & package
        run: |
          cd python
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: |
          cd python
          pytest -v

  go:
    name: Go (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run Go tests
        run: |
          cd go
          CGO_ENABLED=0 go test -v .

  swift:
    name: Swift (macOS)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || true
          swift --version

      - name: Run Swift tests
        run: |
          cd swift
          swift test -v

  wasm:
    name: WebAssembly & TypeScript (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wasm:
              - 'wasm/**'
              - 'native/**'
              - 'scripts/build-wasm.sh'
              - 'scripts/wasm/**'
              - '.credentio-pin'
              - '.github/workflows/ci.yml'

      - name: Set up Node.js
        if: steps.filter.outputs.wasm == 'true' || github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wasm/package-lock.json

      - name: Build WebAssembly Engine
        if: steps.filter.outputs.wasm == 'true' || github.event_name == 'push'
        run: |
          ./scripts/build-wasm.sh

      - name: Install Dependencies
        if: steps.filter.outputs.wasm == 'true' || github.event_name == 'push'
        run: |
          cd wasm
          npm ci

      - name: Typecheck TypeScript SDK
        if: steps.filter.outputs.wasm == 'true' || github.event_name == 'push'
        run: |
          cd wasm
          npm run typecheck

      - name: Run Vitest Suite (Unit & WASM Native Integration)
        if: steps.filter.outputs.wasm == 'true' || github.event_name == 'push'
        run: |
          cd wasm
          npm test
