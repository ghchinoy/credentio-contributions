name: Upstream Drift Check

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    name: Check Google Credentio Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Drift Check Script
        id: drift_check
        run: |
          set +e
          OUTPUT="$(./scripts/check-credentio-drift.sh 2>&1)"
          EXIT_CODE=$?
          echo "output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          PINNED_SHA="$(tr -d '[:space:]' < .credentio-pin)"
          UPSTREAM_SHA="$(git ls-remote https://mediaprovenance.googlesource.com/credentio refs/heads/main | awk '{print $1}')"
          echo "pinned_sha=${PINNED_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"

          echo "$OUTPUT"
          exit 0

      - name: Open or Update Tracking Issue on Drift
        if: steps.drift_check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const pinned = "${{ steps.drift_check.outputs.pinned_sha }}";
            const upstream = "${{ steps.drift_check.outputs.upstream_sha }}";
            const compareUrl = `https://mediaprovenance.googlesource.com/credentio/+log/${pinned}..${upstream}`;
            const issueTitle = `[Upstream Drift] Google Credentio main has advanced beyond pinned commit (${pinned.slice(0, 7)})`;
            const issueLabel = 'upstream-drift';

            const issueBody = [
              '## Upstream Credentio Drift Detected',
              '',
              'The upstream Google Credentio repository (https://mediaprovenance.googlesource.com/credentio/) has new commits on its `main` branch.',
              '',
              `- **Pinned Commit:** \`${pinned}\` (in \`.credentio-pin\`)`,
              `- **Upstream HEAD:** \`${upstream}\``,
              `- **Compare Log:** [${pinned.slice(0, 7)}...${upstream.slice(0, 7)}](${compareUrl})`,
              '',
              '### Next Steps:',
              '1. Review upstream commit log for breaking C++ API or schema changes.',
              '2. Verify local builds and test suites across Python, Go, and Swift:',
              '   ```bash',
              '   make test',
              '   make swift-test',
              '   ```',
              '3. Update the pin:',
              '   ```bash',
              `   echo "${upstream}" > .credentio-pin`,
              '   ```',
              '4. Commit and push the updated baseline.'
            ].join('\n');

            // Search for existing open drift issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: issueLabel
            });

            if (issues.data.length > 0) {
              const existingIssue = issues.data[0];
              console.log(`Updating existing drift issue #${existingIssue.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `### Drift Update (${new Date().toISOString()})\n\nUpstream HEAD is currently \`${upstream}\`.\n[Compare with pinned](${compareUrl})`
              });
            } else {
              console.log('Creating new drift tracking issue');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: [issueLabel]
              });
            }

  verify-builds:
    name: Verify Builds & Native Bindings (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || true
          swift --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Native Shared Library
        run: |
          ./scripts/build-shared-lib.sh

      - name: Run Python Tests (Native C-ABI)
        run: |
          cd python
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -v

      - name: Run Go Tests (CGo Native)
        run: |
          cd go
          CGO_ENABLED=1 go test -v ./...

      - name: Build Swift XCFramework
        env:
          CREDENTIO_ZIP_RELEASE: "1"
        run: |
          ./scripts/build-swift-xcframework.sh --zip

      - name: Validate Swift XCFramework Artifact Integrity
        run: |
          ZIP_FILE="swift/CredentioC.xcframework.zip"
          STATIC_LIB="$(find swift/CredentioC.xcframework -name "libCredentioC.a" | head -n 1)"
          ZIP_SIZE=$(stat -f%z "$ZIP_FILE" 2>/dev/null || stat -c%s "$ZIP_FILE")
          echo "Zip Size: ${ZIP_SIZE} bytes"
          if [ "$ZIP_SIZE" -lt 10000000 ]; then
            echo "ERROR: Release zip is too small (${ZIP_SIZE} bytes < 10 MB)!"
            exit 1
          fi
          nm -g "$STATIC_LIB" | grep -q "riegeli" || { echo "ERROR: Missing riegeli symbols!"; exit 1; }
          nm -g "$STATIC_LIB" | grep -q "absl" || { echo "ERROR: Missing absl symbols!"; exit 1; }
          nm -g "$STATIC_LIB" | grep -q "cr_validate" || { echo "ERROR: Missing cr_validate symbol!"; exit 1; }

      - name: Run Swift Tests (Native In-Process)
        run: |
          cd swift
          swift test -v

