name: Upstream Drift Check

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Optional upstream Git ref or commit SHA to pre-test (e.g., refs/changes/14/8114/3)'
        required: false
        default: ''
      include_pending:
        description: 'Inspect open Gerrit CLs under refs/changes/* when main is in sync'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    name: Check & Analyze Google Credentio Drift
    runs-on: ubuntu-latest
    outputs:
      pinned_sha: ${{ steps.drift_check.outputs.pinned_sha }}
      upstream_sha: ${{ steps.drift_check.outputs.upstream_sha }}
      analyzed_sha: ${{ steps.drift_check.outputs.analyzed_sha }}
      analyzed_ref: ${{ steps.drift_check.outputs.analyzed_ref }}
      recommendation_tier: ${{ steps.drift_check.outputs.recommendation_tier }}
      exit_code: ${{ steps.drift_check.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Drift Check & Upstream Impact Analyzer
        id: drift_check
        env:
          INPUT_TARGET_REF: ${{ github.event.inputs.target_ref }}
          INPUT_INCLUDE_PENDING: ${{ github.event.inputs.include_pending }}
        run: |
          set +e
          OUTPUT="$(./scripts/check-credentio-drift.sh 2>&1)"
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"
          if [[ "$EXIT_CODE" -eq 2 ]]; then
            echo "ERROR: Upstream drift check failed to query remote repository." >&2
            exit 2
          fi

          ANALYZE_ARGS=()
          if [[ -n "${INPUT_TARGET_REF}" ]]; then
            ANALYZE_ARGS+=(--target "${INPUT_TARGET_REF}")
          fi
          if [[ "${INPUT_INCLUDE_PENDING}" != "false" ]]; then
            ANALYZE_ARGS+=(--include-pending)
          fi

          set +e
          REPORT_JSON="$(./scripts/analyze-credentio-upstream.sh "${ANALYZE_ARGS[@]}" --json)"
          ANALYZE_RC=$?
          set -e
          if [[ "$ANALYZE_RC" -eq 2 ]]; then
            echo "ERROR: Upstream impact analysis failed." >&2
            exit 2
          fi

          ./scripts/analyze-credentio-upstream.sh "${ANALYZE_ARGS[@]}" --markdown > drift_analysis_report.md
          cat drift_analysis_report.md >> "$GITHUB_STEP_SUMMARY"

          PINNED_SHA="$(echo "$REPORT_JSON" | jq -r '.pinned_sha')"
          UPSTREAM_SHA="$(echo "$REPORT_JSON" | jq -r '.upstream_main_sha')"
          ANALYZED_SHA="$(echo "$REPORT_JSON" | jq -r '.analyzed_sha')"
          ANALYZED_REF="$(echo "$REPORT_JSON" | jq -r '.analyzed_ref')"
          TIER="$(echo "$REPORT_JSON" | jq -r '.recommendation_tier')"

          {
            echo "exit_code=${EXIT_CODE}"
            echo "pinned_sha=${PINNED_SHA}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "analyzed_sha=${ANALYZED_SHA}"
            echo "analyzed_ref=${ANALYZED_REF}"
            echo "recommendation_tier=${TIER}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Drift Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: drift-analysis-report
          path: drift_analysis_report.md
          retention-days: 14

  verify-builds:
    name: Verify Builds & Native Bindings (macOS)
    needs: check-drift
    if: needs.check-drift.outputs.exit_code == '1' || (github.event_name == 'workflow_dispatch' && needs.check-drift.outputs.analyzed_sha != needs.check-drift.outputs.pinned_sha)
    runs-on: macos-15
    env:
      CREDENTIO_SHA: ${{ needs.check-drift.outputs.analyzed_sha }}
      CREDENTIO_DIR: /tmp/credentio-shared
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: true

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || true
          swift --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone Shared Upstream Credentio Checkout
        run: |
          rm -rf "${CREDENTIO_DIR}"
          git clone https://mediaprovenance.googlesource.com/credentio "${CREDENTIO_DIR}"
          if ! git -C "${CREDENTIO_DIR}" cat-file -e "${CREDENTIO_SHA}^{commit}" 2>/dev/null; then
            git -C "${CREDENTIO_DIR}" fetch origin "${CREDENTIO_SHA}" || git -C "${CREDENTIO_DIR}" fetch origin
          fi
          git -C "${CREDENTIO_DIR}" checkout "${CREDENTIO_SHA}"

      - name: Build Native Shared Library
        run: |
          ./scripts/build-shared-lib.sh

      - name: Run Python Tests (Native C-ABI)
        run: |
          cd python
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -v

      - name: Run Go Tests (CGo Native)
        run: |
          cd go
          CGO_ENABLED=1 go test -v ./...

      - name: Build Swift XCFramework
        env:
          CREDENTIO_ZIP_RELEASE: "1"
        run: |
          ./scripts/build-swift-xcframework.sh --zip

      - name: Validate Swift XCFramework Artifact Integrity
        run: |
          ZIP_FILE="swift/CredentioC.xcframework.zip"
          STATIC_LIB="$(find swift/CredentioC.xcframework -name "libCredentioC.a" | head -n 1)"
          ZIP_SIZE=$(stat -f%z "$ZIP_FILE" 2>/dev/null || stat -c%s "$ZIP_FILE")
          echo "Zip Size: ${ZIP_SIZE} bytes"
          if [ "$ZIP_SIZE" -lt 10000000 ]; then
            echo "ERROR: Release zip is too small (${ZIP_SIZE} bytes < 10 MB)!"
            exit 1
          fi
          nm -g "$STATIC_LIB" | grep -q "riegeli" || { echo "ERROR: Missing riegeli symbols!"; exit 1; }
          nm -g "$STATIC_LIB" | grep -q "absl" || { echo "ERROR: Missing absl symbols!"; exit 1; }
          nm -g "$STATIC_LIB" | grep -q "cr_validate" || { echo "ERROR: Missing cr_validate symbol!"; exit 1; }

      - name: Run Swift Tests (Native In-Process)
        run: |
          cd swift
          swift test -v

      - name: Build WebAssembly Engine & Run WASM Tests
        run: |
          ./scripts/build-wasm.sh --direct
          cd wasm
          npm ci
          npm run build
          npm test

  report-drift:
    name: Open or Update Tracking Issue on Drift
    needs: [check-drift, verify-builds]
    if: always() && needs.check-drift.outputs.exit_code == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Download Drift Analysis Report
        uses: actions/download-artifact@v4
        with:
          name: drift-analysis-report

      - name: Open or Update GitHub Tracking Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pinned = "${{ needs.check-drift.outputs.pinned_sha }}";
            const upstream = "${{ needs.check-drift.outputs.upstream_sha }}";
            const tier = "${{ needs.check-drift.outputs.recommendation_tier }}";
            const buildResult = "${{ needs.verify-builds.result }}";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const reportMarkdown = fs.existsSync('drift_analysis_report.md')
              ? fs.readFileSync('drift_analysis_report.md', 'utf8')
              : '';

            const issueTitle = `[Upstream Drift] Google Credentio main has advanced beyond pinned commit (${pinned.slice(0, 7)})`;
            const issueLabel = 'upstream-drift';

            const issueBody = [
              reportMarkdown,
              '',
              '### Automated Build & Test Verification',
              '',
              `- **CI Verification Status (Python, Go, Swift, WASM):** \`${buildResult.toUpperCase()}\``,
              `- **Workflow Run:** [View Run](${runUrl})`,
              `- **Recommendation Tier:** \`${tier}\``,
              '',
              '### Pin Update Command',
              '```bash',
              `echo "${upstream}" > .credentio-pin`,
              '```'
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: issueLabel
            });

            if (issues.data.length > 0) {
              const existingIssue = issues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `### Drift Update (${new Date().toISOString()})\n\n${issueBody}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: [issueLabel]
              });
            }
